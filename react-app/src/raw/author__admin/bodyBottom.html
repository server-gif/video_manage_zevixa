  <style>
    /* FLOATING AD CONTAINER */
    #floatingAdContainer {
      position: fixed;
      top: 20px;
      right: -320px;
      width: 320px;
      height: 260px;
      z-index: 99999;
      display: flex;
      align-items: center;
      transition: right 0.5s ease;
    }

    /* ACTIVE (VISIBLE) */
    #floatingAdContainer.active {
      right: 10px;
    }

    /* AD BOX */
    #floatingAdContent {
      width: 300px;
      height: 250px;
      background: #fff;
      border-radius: 10px 0 0 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* TOGGLE BUTTON */
    #floatingAdToggle {
      position: absolute;
      left: -30px;
      width: 30px;
      height: 30px;
      background: #000;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 50%;
      font-size: 18px;
      font-weight: bold;
    }

    /* ICONS */
    #floatingAdToggle::before {
      content: "\203A";
    }

    #floatingAdContainer.active #floatingAdToggle::before {
      content: "\2715";
    }

    #floatingAdContainer.active #floatingAdToggle {
      transform: rotate(180deg);
    }

    /* MOBILE OPTIMIZATION */
    @media (max-width: 768px) {
      #floatingAdContainer {
        top: 20px;
        bottom: 10px;
        right: -320px;
      }

      #floatingAdContainer.active {
        right: 10px;
      }
    }
  </style>


  <style>
    #bottom-ad-container {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      text-align: center;
      z-index: 9999;
      background: #fff;
      max-height: 300px;
      overflow: hidden;
      padding-bottom: env(safe-area-inset-bottom);
      box-shadow: 0 -2px 10px rgb(0 0 0 / .1);
      transition: all 0.3s ease
    }

    #bottom-ad-container.collapsed {
      max-height: 0
    }

    #div-gpt-ad-bottom {
      margin: 0 auto
    }

    #toggle-ad {
      position: absolute;
      right: 8px;
      top: 8px;
      background: rgb(0 0 0 / .7);
      color: #fff;
      border: none;
      font-size: 16px;
      padding: 4px 8px;
      cursor: pointer;
      z-index: 10000;
      border-radius: 4px;
      display: none;
      transform: rotate(-90deg);
      transition: transform 0.3s ease, background 0.2s ease
    }

    #toggle-ad:hover {
      background: #333
    }

    #bottom-ad-container.collapsed #toggle-ad {
      transform: rotate(90deg)
    }
  </style>
  <style>
    #outstream-ad-container {
      position: fixed;
      left: 10px;
      top: 320px;
      width: 300px;
      max-width: 90vw;
      height: 250px;
      background: #000;
      z-index: 99999;
      border-radius: 10px;
      overflow: hidden;
      display: none;
      box-shadow: 0 8px 32px rgb(0 0 0 / .45)
    }

    .ad-label {
      position: absolute;
      top: 6px;
      left: 8px;
      font-size: 10px;
      font-family: sans-serif;
      color: rgb(255 255 255 / .85);
      background: rgb(0 0 0 / .45);
      padding: 2px 6px;
      border-radius: 3px;
      z-index: 20;
      pointer-events: none
    }

    #ad-close {
      position: absolute;
      top: 5px;
      right: 8px;
      font-size: 13px;
      font-family: sans-serif;
      font-weight: 700;
      min-width: 24px;
      text-align: center;
      line-height: 20px;
      padding: 2px 7px;
      border-radius: 4px;
      z-index: 21;
      user-select: none;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, background 0.2s ease
    }

    #ad-close.counting {
      opacity: 1;
      pointer-events: none;
      cursor: default;
      background: rgb(180 180 180 / .85);
      color: #444
    }

    #ad-close.ready {
      opacity: 1;
      pointer-events: auto;
      cursor: pointer;
      background: rgb(255 255 255 / .92);
      color: #000
    }

    #outstream-ad-container:hover #ad-close.ready {
      opacity: 1
    }

    #ad-slot {
      width: 100%;
      height: 100%
    }

    @media (max-width:480px) {
      #outstream-ad-container {
        left: 50%;
        transform: translateX(-50%);
        top: auto;
        bottom: 20px;
        width: 320px
      }
    }
  </style>
